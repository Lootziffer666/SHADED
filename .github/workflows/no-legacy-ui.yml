name: UI Zero Contracts

# pull_request deliberately omitted: "SHADED Verify" (test.yml) already runs the exact same
# `npm run check` on every pull_request, so this workflow would just duplicate that same run on
# every PR (the same class of redundant-CI issue vercel.yml's own comment documents fixing).
# This workflow's remaining, non-duplicate value is fast feedback on a plain push to a feature
# branch, before a PR exists at all -- test.yml's push trigger is restricted to main only.
on:
  push:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      # ubuntu-latest already ships the system libraries Playwright Chromium needs.
      # Avoid `--with-deps`: it performs a fresh apt transaction on every run and
      # made browser verification depend on Ubuntu mirror availability.
      - run: npx playwright install chromium
      - run: npm run check
