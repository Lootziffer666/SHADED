name: SHADED Verify

on: [push, pull_request]

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - name: Install dependencies
      run: |
        npm ci

    - name: Install Chromium for browser verification
      run: |
        # ubuntu-latest already ships the system libraries Playwright Chromium needs.
        # Avoid `--with-deps`: it performs a fresh apt transaction on every run and
        # made browser verification depend on Ubuntu mirror availability.
        npx playwright install chromium

    - name: Verify viewport-first mobile editor, closing, correction and room entry
      run: |
        npm run verify:mobile-editor

    - name: Verify service worker, offline demo, and spatial editor in Chromium
      run: |
        npm run verify:pwa-browser

    - name: Verify visible spatial stages and walk behind the house
      run: |
        npm run verify:walk
