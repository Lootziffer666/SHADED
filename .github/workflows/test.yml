name: SHADED Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - name: Install dependencies
      run: npm ci

    # ubuntu-latest already ships the system libraries Playwright Chromium needs.
    # Avoid `--with-deps`: it performs a fresh apt transaction on every run and
    # made browser verification depend on Ubuntu mirror availability.
    - name: Install Playwright Chromium
      run: npx playwright install chromium

    - name: Run runtime contracts and deterministic tests
      run: npm run check

    - name: Verify single-view reconstruction Python path
      run: |
        pip3 install -r tools/requirements-single-view-room.txt
        python3 tools/test-single-view-room.py
