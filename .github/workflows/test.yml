name: SHADED Verify

on: [push, pull_request]

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - name: Install dependencies
      run: |
        npm ci

    - name: Install Chromium for browser verification
      run: |
        npx playwright install --with-deps chromium

    - name: Run deterministic contract and spatial tests
      run: |
        npm run check

    - name: Verify service worker, offline demo, and spatial editor in Chromium
      run: |
        npm run verify:pwa-browser

    - name: Verify visible spatial stages and walk behind the house
      run: |
        npm run verify:walk
