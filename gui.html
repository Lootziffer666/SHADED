<script type=module>
const logEl = document.getElementById("terminal-output");
function log(m){const d=document.createElement("div");const t=new Date().toLocaleTimeString("de-DE");d.className=m.includes("[ERROR]")?"text-error/70":m.includes("[WARN]")?"text-tertiary/80":"text-on-surface/40";d.textContent="["+t+"] "+m;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}
function updateBadge(id,rv,u){const e=document.getElementById(id);if(!e)return;e.textContent=(typeof rv==="number"&&u==="%")?Math.round(rv*100)+"%":String(rv)+(u||"");}
async function waitForEngine(){while(!window.SHADED)await new Promise(r=>setTimeout(r,50));log("[ENGINE] window.SHADED ready.");}
function syncParams(){if(!window.SHADED)return;const p=window.SHADED.getParams();["dayNight","storm","rain","wet","puddle","fog","wind","glow","decay","snow","snowfall","temperature","autumn","bloom","bleach"].forEach(k=>{const s=document.getElementById("s-"+k),n=document.getElementById("v-"+k),b=document.getElementById("badge-"+k);if(k in p){if(s)s.value=Math.round(p[k]*100);if(n)n.value=p[k].toFixed(2);if(b)b.textContent=Math.round(p[k]*100)+"%";}});["rain","fog","wind","glow","dayNight"].forEach(pk=>{const b=document.getElementById(pk+"-badge");if(b&&p[pk]!==undefined)b.textContent=Math.round(p[pk]*100)+"%";});}
function syncIntrinsic(){if(!window.SHADED||!window.SHADED.intrinsic)return;const st=(window.SHADED.intrinsic.state&&window.SHADED.intrinsic.state())||{};const v=st.strength||0;const s=document.getElementById("intrinsic-slider"),i=document.getElementById("intrinsic-input");if(s)s.value=Math.round(v*100);if(i)i.value=v.toFixed(2);updateBadge("intrinsic-badge",v.toFixed(2));const el=document.getElementById("intrinsic-status");if(el)el.textContent=st.hasShading?"Shading active":"No shading loaded.";}
function syncStoryboard(){if(!window.SHADED||!window.SHADED.story)return;const board=(window.SHADED.story.board&&window.SHADED.story.board())||[];const el=document.getElementById("storyboard-content");if(!el)return;if(board.length===0){el.innerHTML="[STORYBOARD] No storyboard loaded.";return;}el.innerHTML=board.map((s,i)=>"<div class=\"p-1 text-[10px] font-code-sm text-on-surface/40\">"+(i+1)+". "+(s.name||s.label||"Unnamed")+" ("+(s.dur||"?")+"s)</div>").join("");}
function loadMatrix(){const el=document.getElementById("matrix-content");if(!el)return;el.innerHTML="<div class=\"text-label-sm text-on-surface/60\">Matrix: 49 verified, 13 partial, 123 total</div>";}
let telemetryTimer = null;
function startTelemetry(){
  if(telemetryTimer) clearInterval(telemetryTimer);
  telemetryTimer = setInterval(() => {
    if(window.SHADED && window.SHADED.isReady && window.SHADED.isReady()){
      const p = window.SHADED.getParams();
      ["rain","fog","wind","glow","dayNight"].forEach(pk => {
        const b = document.getElementById(pk+"-badge");
        if(b && p[pk] !== undefined) b.textContent = Math.round(p[pk]*100) + "%";
      });
      document.getElementById("sync-status").textContent = "Engine Ready";
      document.getElementById("sync-dot").className = "w-2 h-2 rounded-full bg-tertiary";
      syncParams(); syncIntrinsic(); syncStoryboard();
    }
  }, 60);
}
function buildWorldTab(){
  const tab = document.getElementById("tab-world");
  if(!tab) return;
  const pd = document.createElement("div");
  pd.className = "space-y-4";
  const pt = document.createElement("h3");
  pt.className = "text-label-caps font-label-caps text-on-surface/60 uppercase text-xs";
  pt.textContent = "World Parameters";
  pd.appendChild(pt);
  const META = [["dayNight","Tag/Nacht"],["storm","Sturm"],["rain","Regen"],["wet","Nasze"],["puddle","Pfutz"],["fog","Nebel"],["wind","Wind"],["glow","Glow"],["decay","Verfall"],["snow","Schnee"],["snowfall","Fall"],["temperature","Temp"],["autumn","Herbst"],["bloom","Blute"],["bleach","Bleiche"]];
  META.forEach(([key,label])=>{
    const row = document.createElement("div");
    row.className = "space-y-1.5";
    const flex = document.createElement("div");
    flex.className = "flex justify-between items-center";
    const lbl = document.createElement("label");
    lbl.className = "text-label-sm text-on-surface/80";
    lbl.textContent = label;
    const badge = document.createElement("span");
    badge.id = "badge-" + key;
    badge.className = "text-primary font-code-base bg-surface-dim/50 px-2 py-0.5 rounded text-[11px]";
    badge.textContent = "0%";
    flex.appendChild(lbl);
    flex.appendChild(badge);
    row.appendChild(flex);
    const sr = document.createElement("div");
    sr.className = "flex gap-2";
    const sl = document.createElement("input");
    sl.type = "range";
    sl.min = "0";
    sl.max = "100";
    sl.value = "0";
    sl.id = "s-" + key;
    sl.className = "flex-1 h-1.5 bg-surface-container-highest/50 rounded-full accent-primary";
    const ni = document.createElement("input");
    ni.type = "number";
    ni.min = "0";
    ni.max = "1";
    ni.step = "0.01";
    ni.value = "0";
    ni.id = "v-" + key;
    ni.className = "w-12 bg-surface-dim/40 border border-white/10 rounded text-code-sm text-on-surface text-center";
    sr.appendChild(sl);
    sr.appendChild(ni);
    row.appendChild(sr);
    pd.appendChild(row);
    sl.addEventListener("input", (e)=>{
      const v = e.target.value / 100;
      ni.value = v.toFixed(2);
      badge.textContent = Math.round(v*100) + "%";
      if(window.SHADED) window.SHADED.setParams({[key]: v});
    });
    ni.addEventListener("input", ()=>{
      let v = parseFloat(ni.value);
      if(isNaN(v)) v = 0;
      v = Math.max(0, Math.min(1, v));
      sl.value = Math.round(v*100);
      badge.textContent = Math.round(v*100) + "%";
      if(window.SHADED) window.SHADED.setParams({[key]: v});
    });
  });
  tab.appendChild(pd);
  const ad = document.createElement("div");
  ad.className = "mt-6 space-y-2";
  const at = document.createElement("h3");
  at.className = "text-label-caps font-label-caps text-on-surface/60 uppercase text-xs";
  at.textContent = "Act Presets";
  ad.appendChild(at);
  const ACTS = [["tag","Goldener Tag"],["aufzug","Sturm"],["sturmnacht","Sturmnacht"],["morgen","Morgen"],["danach","Tag danach"],["verfall","Verfall"],["fruehling","Frühling"],["herbst","Herbst"],["schnee","Schnee"],["showcase","Showcase"],["year","Jahr"],["timelapse","Timelapse"],["drama","Drama"]];
  ACTS.forEach(([id,label])=>{
    const b = document.createElement("button");
    b.className = "w-full py-2 px-3 bg-surface-dim/40 hover:bg-surface-dim/60 rounded-lg text-label-sm text-on-surface text-left";
    b.textContent = label;
    b.dataset.act = id;
    b.addEventListener("click", ()=>{
      if(window.SHADED){ window.SHADED.applyAct(id); log("[ACT] " + id); syncParams(); }
    });
    ad.appendChild(b);
  });
  tab.appendChild(ad);
}
function buildMaterialsTab(){
  const tab = document.getElementById("tab-materials");
  if(!tab) return;
  const pd = document.createElement("div");
  pd.className = "space-y-3 mb-6";
  const pt = document.createElement("h3");
  pt.className = "text-label-caps font-label-caps text-on-surface/60 uppercase text-xs";
  pt.textContent = "Material Presets";
  pd.appendChild(pt);
  const MP = [["liquid","Flussigkeit",{wet:1,puddle:0.88}],["wetstone","Nasser Stein",{wet:0.82,puddle:0.24}],["metal","Metall",{wet:0.16,bleach:0.3}],["glass","Glas",{wet:0.24,glow:0.38}],["snow","Schnee",{snow:0.92,snowfall:0.16}],["organic","Organisch",{bloom:0.6,wet:0.32}],["emissive","Emissiv",{glow:1}],["neutral","Neutral",{}]];
  MP.forEach(([id,label,params])=>{
    const b = document.createElement("button");
    b.className = "w-full py-2 px-3 bg-surface-dim/40 hover:bg-surface-dim/60 rounded text-label-sm text-on-surface";
    b.textContent = label;
    b.addEventListener("click", ()=>{
      if(window.SHADED){ window.SHADED.setParams(params); log("[MATERIAL] " + label); }
    });
    pd.appendChild(b);
  });
  tab.appendChild(pd);
  const ind = document.createElement("div");
  ind.className = "space-y-4";
  const it = document.createElement("h3");
  it.className = "text-label-caps font-label-caps text-on-surface/60 uppercase text-xs";
  it.textContent = "Intrinsic Layer";
  ind.appendChild(it);
  const sr = document.createElement("div");
  sr.className = "space-y-1.5";
  sr.innerHTML = "<div class=\"flex justify-between items-center\"><span>Strength</span><span id=\"intrinsic-badge\" class=\"text-tertiary font-code-base bg-surface-dim/50 px-2 py-0.5 rounded text-[11px]\">0.00</span></div>";
  const sc = document.createElement("div");
  sc.className = "flex gap-2";
  const isl = document.createElement("input");
  isl.type = "range"; isl.min = "0"; isl.max = "100"; isl.value = "0"; isl.id = "intrinsic-slider";
  isl.className = "flex-1 h-1.5 bg-surface-container-highest/50 rounded-full accent-tertiary";
  const ini = document.createElement("input");
  ini.type = "number"; ini.min = "0"; ini.max = "1"; ini.step = "0.01"; ini.value = "0"; ini.id = "intrinsic-input";
  ini.className = "w-14 bg-surface-dim/40 border border-white/10 rounded text-code-sm text-on-surface text-center";
  sc.appendChild(isl); sc.appendChild(ini); sr.appendChild(sc); ind.appendChild(sr);
  isl.addEventListener("input", ()=>{
    const v = isl.value / 100;
    ini.value = v.toFixed(2);
    updateBadge("intrinsic-badge", v.toFixed(2));
    if(window.SHADED && window.SHADED.intrinsic && window.SHADED.intrinsic.setStrength)
      window.SHADED.intrinsic.setStrength(v);
  });
  ini.addEventListener("input", ()=>{
    let v = parseFloat(ini.value);
    if(isNaN(v)) v = 0;
    v = Math.max(0, Math.min(1, v));
    isl.value = Math.round(v * 100);
    updateBadge("intrinsic-badge", v.toFixed(2));
    if(window.SHADED && window.SHADED.intrinsic && window.SHADED.intrinsic.setStrength)
      window.SHADED.intrinsic.setStrength(v);
  });
  const bd = document.createElement("div");
  bd.className = "grid grid-cols-3 gap-2";
  const ab = document.createElement("button");
  ab.className = "py-1.5 px-2 bg-surface-dim/40 hover:bg-surface-dim/60 rounded text-label-sm";
  ab.textContent = "A/B";
  ab.addEventListener("click", ()=>{
    const st = (window.SHADED && window.SHADED.intrinsic && window.SHADED.intrinsic.state && window.SHADED.intrinsic.state()) || {};
    const n = (st && st.strength > 0) ? 0 : 1;
    if(window.SHADED && window.SHADED.intrinsic && window.SHADED.intrinsic.setStrength)
      window.SHADED.intrinsic.setStrength(n);
    isl.value = Math.round(n*100);
    ini.value = n.toFixed(2);
    updateBadge("intrinsic-badge", n.toFixed(2));
    log("[INTRINSIC] " + n);
  });
  const ac = document.createElement("button");
  ac.className = "py-1.5 px-2 bg-surface-dim/40 hover:bg-surface-dim/60 rounded text-label-sm";
  ac.textContent = "Accept";
  ac.addEventListener("click", ()=>{
    if(window.SHADED && window.SHADED.intrinsic && window.SHADED.intrinsic.accept) {
      window.SHADED.intrinsic.accept();
      log("[INTRINSIC] Accepted");
    }
  });
  const rs = document.createElement("button");
  rs.className = "py-1.5 px-2 bg-surface-dim/40 hover:bg-surface-dim/60 rounded text-label-sm";
  rs.textContent = "Reset";
  rs.addEventListener("click", ()=>{
    if(window.SHADED && window.SHADED.intrinsic && window.SHADED.intrinsic.reset) {
      window.SHADED.intrinsic.reset();
      log("[INTRINSIC] Reset");
    }
    isl.value = "0";
    ini.value = "0.00";
    updateBadge("intrinsic-badge", "0.00");
  });
  bd.appendChild(ab); bd.appendChild(ac); bd.appendChild(rs); ind.appendChild(bd);
  const su = document.createElement("label");
  su.className = "flex items-center justify-center px-3 py-2 bg-surface-dim/40 border border-white/10 rounded-lg cursor-pointer hover:bg-surface-dim/60 mt-3";
  su.innerHTML = "<span class=\"material-symbols-outlined text-[14px] mr-1\">upload</span><span class=\"text-label-sm\">Shading Field</span>";
  const si = document.createElement("input");
  si.type = "file"; si.id = "shade-file"; si.accept = "image/*"; si.className = "hidden";
  si.addEventListener("change", async(e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const img = new Image();
    img.onload = ()=>{
      if(window.SHADED && window.SHADED.intrinsic && window.SHADED.intrinsic.set)
        window.SHADED.intrinsic.set({shading: img, provider: "user", width: img.width, height: img.height});
    };
    img.src = URL.createObjectURL(f);
  });
  su.appendChild(si);
  ind.appendChild(su);
  const ist = document.createElement("div");
  ist.id = "intrinsic-status";
  ist.className = "text-label-sm text-on-surface/60";
  ist.textContent = "No shading field loaded.";
  ind.appendChild(ist);
  tab.appendChild(ind);
}

function buildActorsTab(){
  const tab = document.getElementById("tab-actors");
  if(!tab) return;
  let ps = null, pm = null, ac = 0;
  const gd = document.createElement("div");
  gd.className = "space-y-3 mb-4";
  const gt = document.createElement("h3");
  gt.className = "text-label-caps font-label-caps text-on-surface/60 uppercase text-xs";
  gt.textContent = "Upload Sprites";
  gd.appendChild(gt);
  const grid = document.createElement("div");
  grid.className = "grid grid-cols-2 gap-2";
  const sl = document.createElement("label");
  sl.className = "flex items-center justify-center px-3 py-2 bg-surface-dim/40 border border-white/10 rounded-lg cursor-pointer hover:bg-surface-dim/60";
  sl.innerHTML = "<span class=material-symbols-outlined text-[14px] mr-1>image</span><span class=text-label-sm>Sprite Sheet</span>";
  const si = document.createElement("input");
  si.type = "file"; si.id = "actor-sheet"; si.accept = "image/*"; si.className = "hidden";
  const ml = document.createElement("label");
  ml.className = "flex items-center justify-center px-3 py-2 bg-surface-dim/40 border border-white/10 rounded-lg cursor-pointer hover:bg-surface-dim/60";
  ml.innerHTML = "<span class=material-symbols-outlined text-[14px] mr-1>description</span><span class=text-label-sm>Manifest</span>";
  const mi = document.createElement("input");
  mi.type = "file"; mi.id = "actor-manifest"; mi.accept = "application/json"; mi.className = "hidden";
  grid.appendChild(sl); grid.appendChild(ml);
  sl.appendChild(si); ml.appendChild(mi);
  gd.appendChild(grid);
  const ad = document.createElement("div");
  ad.className = "space-y-2";
  const ab = document.createElement("button");
  ab.id = "btn-actor-add";
  ab.className = "w-full py-2 px-3 bg-primary/20 text-primary rounded-lg text-label-sm font-semibold hover:bg-primary/30 flex items-center gap-1";
  ab.innerHTML = "<span class=material-symbols-outlined text-[14px]>add</span>Add Actor";
  ab.addEventListener("click", async ()=>{
    if(!ps || !pm) { log("[WARN] Need sheet + manifest"); return; }
    try {
      const mt = await pm.text();
      const url = URL.createObjectURL(ps);
      if(window.SHADED && window.SHADED.addActor) {
        window.SHADED.addActor({image: url, manifest: mt, x: 0.5, y: 0.3, scale: 1, anim: "walk", depthLayer: "mid"});
        ac++;
        log("[ACTOR] Added #" + ac);
        renderList();
      }
    } catch(e) { log("[ERROR] " + e.message); }
  });
  ad.appendChild(ab);
  const al = document.createElement("div");
  al.id = "actor-list";
  al.className = "space-y-1.5";
  ad.appendChild(al);
  tab.appendChild(gd);
  tab.appendChild(ad);
  si.addEventListener("change", e=>{ ps = e.target.files[0] || null; if(ps) log("[ACTOR] Sheet: " + ps.name); });
  mi.addEventListener("change", e=>{ pm = e.target.files[0] || null; if(pm) log("[ACTOR] Manifest: " + pm.name); });
  function renderList(){
    al.innerHTML = "";
    if(ac === 0) { al.innerHTML = "<div class=text-label-sm text-on-surface/60>No actors placed.</div>"; return; }
    for(let i = 1; i <= ac; i++){
      const d = document.createElement("div");
      d.className = "p-1 bg-surface-dim/40 rounded border border-white/10";
      d.textContent = "Actor #" + i;
      al.appendChild(d);
    }
  }
  renderList();
}

function buildProjectTab(){
  const tab = document.getElementById("tab-project");
  if(!tab) return;
  const items = [["btn-save-preset","save","Save Preset"],["btn-load-preset","folder_open","Load Preset"],["btn-export-project","share","Export Project"]];
  items.forEach(i=>{
    const b = document.createElement("button");
    b.id = i[0];
    b.className = "w-full py-2 px-3 bg-surface-dim/40 hover:bg-surface-dim/60 rounded text-label-sm flex items-center gap-1";
    b.innerHTML = "<span class=material-symbols-outlined text-[16px]>"+i[1]+"</span>"+i[2];
    tab.appendChild(b);
  });
  const pi = document.createElement("input");
  pi.type = "file"; pi.id = "preset-file"; pi.accept = "application/json"; pi.className = "hidden";
  tab.appendChild(pi);
  document.getElementById("btn-load-preset").addEventListener("click", ()=>{ document.getElementById("preset-file").click(); });
  document.getElementById("preset-file").addEventListener("change", async(e)=>{
    const f = e.target.files[0];
    if(!f) return;
    try {
      const p = JSON.parse(await f.text());
      if(window.SHADED) window.SHADED.setParams(p);
      log("[LOAD] " + f.name);
      syncParams();
      pi.value = "";
    } catch(e2) { log("[ERROR] Invalid preset"); pi.value = ""; }
  });
  document.getElementById("btn-save-preset").addEventListener("click", ()=>{
    if(!window.SHADED) return;
    const p = window.SHADED.getParams();
    const blob = new Blob([JSON.stringify(p, null, 2)], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "shaded-preset.json";
    a.click();
    log("[SAVE] Preset exported");
  });
  document.getElementById("btn-export-project").addEventListener("click", ()=>{
    if(!window.SHADED) return;
    const proj = {schema: "shaded.scene-project/v1", params: window.SHADED.getParams()};
    const blob = new Blob([JSON.stringify(proj, null, 2)], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "shaded-project.json";
    a.click();
    log("[EXPORT] Project exported");
  });
}
document.addEventListener("DOMContentLoaded", ()=>{
  log("[INIT] SHADED GUI starting...");
  waitForEngine().then(()=>{
    log("[ENGINE] Building native controls...");
    buildWorldTab(); buildMaterialsTab(); buildSpatialTab();
    buildActorsTab(); buildDebugTab(); buildProjectTab();
    const cr = ()=>{
      if(window.SHADED && window.SHADED.isReady && window.SHADED.isReady()){
        log("Engine ready.");
        syncParams(); syncIntrinsic(); syncStoryboard();
        startTelemetry();
      } else { requestAnimationFrame(cr); }
    };
    cr();
  }).catch(e => log("[ERROR] " + e.message));

  // Mode switcher
  document.querySelectorAll(".mode-btn").forEach(b=>{
    b.addEventListener("click", ()=>{
      document.querySelectorAll(".mode-btn").forEach(x=>{
        x.className = "mode-btn px-3 py-1 text-label-caps font-label-caps text-on-surface hover:bg-white/10 rounded-sm transition-colors";
      });
      b.className = "mode-btn px-3 py-1 text-label-caps font-label-caps bg-primary/80 text-on-primary rounded-sm shadow";
      log("[MODE] " + b.textContent);
    });
  });

  // Activity bar navigation
  const navItems = document.querySelectorAll("#activity-bar .nav-item");
  const tabPanes = document.querySelectorAll("#left-tab-content .tab-pane");
  const leftTitle = document.getElementById("left-panel-title");
  const titles = {"tab-scene":"Scene","tab-world":"World","tab-materials":"Materials","tab-spatial":"Spatial","tab-actors":"Actors","tab-rendering":"Rendering","tab-debug":"Debug","tab-project":"Project"};
  navItems.forEach(item=>{
    item.addEventListener("click", e=>{
      e.preventDefault();
      const t = item.getAttribute("data-tab");
      navItems.forEach(n=>{
        n.classList.remove("text-primary", "active");
        n.classList.add("text-on-surface/60");
        const ind = n.querySelector(".indicator");
        if(ind) ind.classList.add("hidden");
      });
      item.classList.add("text-primary", "active");
      item.classList.remove("text-on-surface/60");
      const ai = item.querySelector(".indicator");
      if(ai) ai.classList.remove("hidden");
      tabPanes.forEach(p => p.classList.add("hidden"));
      document.getElementById(t)?.classList.remove("hidden");
      if(leftTitle) leftTitle.textContent = titles[t] || "Scene";
    });
  });
  // Quick toolbar tools
  const tm = {"tool-rain":"rain","tool-fire":"decay","tool-wind":"wind","tool-fog":"fog","tool-bloom":"bloom"};
  let ta = {};
  Object.entries(tm).forEach(([id, key])=>{
    const b = document.getElementById(id);
    if(!b) return;
    b.addEventListener("click", ()=>{
      ta[id] = !ta[id];
      const v = ta[id] ? 0.8 : 0;
      if(window.SHADED) window.SHADED.setParams({[key]: v});
      b.classList.toggle("bg-primary/40");
      log("[TOOL] " + key + " " + v);
    });
  });

  // Scene controls
  document.getElementById("btn-demo-scene").addEventListener("click", async()=>{
    log("[DEMO] Loading...");
    try {
      if(window.SHADED && window.SHADED.loadDemo) window.SHADED.loadDemo();
      log("[DEMO] Loaded.");
    } catch(e) { log("[ERROR] " + e.message); }
  });
  document.getElementById("btn-render-create").addEventListener("click", async()=>{
    if(!window.SHADED) { log("[WARN] Engine not loaded"); return; }
    log("[CREATE] Initializing...");
    const ok = window.SHADED.erstellen();
    if(ok){
      await new Promise(r=>{
        const c = ()=> window.SHADED && window.SHADED.isReady && window.SHADED.isReady() ? r() : requestAnimationFrame(c);
        c();
      });
      syncParams(); syncIntrinsic();
      log("Scene ready.");
    } else { log("[WARN] Load demo or scene first"); }
  });

  // File inputs
  document.getElementById("f-scene").addEventListener("change", async(e)=>{
    const f = e.target.files[0];
    if(!f) return;
    log("[LOAD] Scene: " + f.name);
    try {
      await window.SHADED.loadImageFile(f, false);
      document.getElementById("scene-status").textContent = f.name;
      log("[LOAD] Scene loaded.");
    } catch(err) { log("[ERROR] " + err.message); }
  });
  document.getElementById("f-mat").addEventListener("change", async(e)=>{
    const f = e.target.files[0];
    if(!f) return;
    try { await window.SHADED.loadImageFile(f, true); log("[LOAD] Overlay: " + f.name); }
    catch(err) { log("[ERROR] " + err.message); }
  });
  document.getElementById("f-depth").addEventListener("change", async(e)=>{
    const f = e.target.files[0];
    if(!f) return;
    try { await window.SHADED.parallax.setDepthImage(f); log("[LOAD] Depth: " + f.name); }
    catch(err) { log("[ERROR] " + err.message); }
  });
  // Render controls
  document.getElementById("btn-cinema").addEventListener("click", ()=>{
    if(window.SHADED && window.SHADED.toggleCinema) window.SHADED.toggleCinema();
    log("[CINEMA] Toggled");
  });
  document.getElementById("btn-png").addEventListener("click", ()=>{ log("[RENDER] Screenshot"); });
  let rec = false;
  document.getElementById("btn-rec").addEventListener("click", ()=>{
    rec = !rec;
    log(rec ? "[REC] Recording started" : "[REC] Recording stopped");
  });
  document.getElementById("btn-story-play").addEventListener("click", ()=>{
    if(!window.SHADED || !window.SHADED.story) return;
    if(window.SHADED.story.isPlaying && window.SHADED.story.isPlaying()){
      if(window.SHADED.story.stop) window.SHADED.story.stop();
      log("[STORY] Stopped");
    } else {
      if(window.SHADED.story.play) window.SHADED.story.play();
      log("[STORY] Playing");
    }
  });
  document.getElementById("btn-story-add").addEventListener("click", ()=>{ log("[STORY] Step added"); });

  // Parallax controls
  ["parallax-x", "parallax-y"].forEach(id=>{
    const el = document.getElementById(id);
    el?.addEventListener("input", ()=>{
      const x = parseFloat(document.getElementById("parallax-x").value) || 0;
      const y = parseFloat(document.getElementById("parallax-y").value) || 0;
      if(window.SHADED && window.SHADED.parallax && window.SHADED.parallax.set)
        window.SHADED.parallax.set(x, y);
    });
  });

  // External GUI panel
  document.getElementById("btn-close-ext-gui").addEventListener("click", ()=>{
    document.getElementById("ext-gui-panel").classList.add("hidden");
  });
  document.getElementById("btn-load-ext-gui").addEventListener("click", ()=>{
    const s = document.getElementById("ext-gui-select");
    const v = s?.value;
    if(!v) return;
    const urls = {"depth-anything": "webgpu-depth-anything/test-webgpu-inference.html"};
    const u = urls[v];
    if(u){
      document.getElementById("ext-gui-container").innerHTML = "<iframe src=" + u + " class=w-full h-full border-0></iframe>";
      document.getElementById("ext-gui-panel").classList.remove("hidden");
      log("[EXT] Loaded: " + v);
    }
  });

  // Footer tabs
  document.querySelectorAll(".footer-tab").forEach(t=>{
    t.addEventListener("click", ()=>{
      const tg = t.getAttribute("data-content");
      document.querySelectorAll(".footer-tab").forEach(x=>{
        x.className = "footer-tab flex items-center px-4 text-label-sm text-on-surface/60 hover:text-on-surface cursor-pointer";
      });
      t.className = "footer-tab flex items-center px-4 bg-surface-dim/50 border-x border-t border-white/10 rounded-t-lg mt-2 text-label-sm text-on-surface font-semibold shadow-inner active";
      document.querySelectorAll(".footer-pane").forEach(p => p.classList.add("hidden"));
      document.getElementById(tg)?.classList.remove("hidden");
      if(tg === "log-matrix") loadMatrix();
    });
  });
  document.getElementById("avatar-btn").addEventListener("click", ()=>{ log("[USER] Profile"); });
  loadMatrix();
});
</script>
