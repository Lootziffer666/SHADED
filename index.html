<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="application-name" content="SHADED">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SHADED — Runtime Host</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/shaded.svg" type="image/svg+xml">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  body{min-height:100dvh}
  #render-container{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;background:#000!important}
  #canvas-wrap{position:absolute!important;inset:0!important;width:100%!important;height:100%!important}
  #gl,#ov{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;border-radius:0!important;box-shadow:none!important}
  #ov{pointer-events:none!important}
</style>
</head>
<body>
<div id="render-container" aria-label="SHADED runtime render surface"></div>
<script>
  console.log('[SHADED] UI-zero runtime host loaded');
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('./service-worker.js').catch((error) => console.warn('[SHADED] service worker:', error));
  }
</script>
<script type="module" src="runtime/shaded-engine.mjs"></script>
<script type="module" src="runtime/dialogue-engine.mjs"></script>
<script type="module" src="runtime/actor-bridge.mjs"></script>
<script type="module" src="runtime/weather-particles.mjs"></script>
<script type="module" src="runtime/player-fire.mjs"></script>
<script type="module" src="integrations/headless-orchestrator.js"></script>
</body>
</html>
